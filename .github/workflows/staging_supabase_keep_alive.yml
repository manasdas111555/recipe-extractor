name: Supabase Staging Free-Tier Keep-Alive & Monitoring

on:
  schedule:
    # Runs 3 times daily (at 00:17, 08:17, 16:17 UTC) to generate database activity
    # and mitigate Supabase Free-Tier 7-day inactivity project dormancy.
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:
    # Allows manual trigger for authorized on-demand operational verification.

permissions:
  contents: read

jobs:
  staging-keep-alive:
    name: Probe Staging Supabase Database Activity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Execute Staging Supabase Keep-Alive Probe
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
        run: |
          python scripts/staging_supabase_keep_alive.py
